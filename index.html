<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick'em Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F7F9FC; --line:#E0E6EE; --line2:#CFD8E3;
    --ink:#0D1724; --muted:#64748B; --accent:#0F6F56; --accent-soft:#E2F2EC;
    --live:#C2410C; --live-soft:#FDEDE3; --gold:#B88A2E; --me:#12456B; --me-soft:#E4EEF6;
    --sh:0 1px 2px rgba(13,23,36,.05),0 2px 8px rgba(13,23,36,.04);
    --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0A111B; --surface:#121C2A; --surface2:#17222F; --line:#243040; --line2:#2E3B4D;
    --ink:#E8EDF4; --muted:#8E9EB2; --accent:#3FB68F; --accent-soft:#11332A;
    --live:#F08A4B; --live-soft:#36210F; --gold:#D9AE55; --me:#8CC0E4; --me-soft:#14283A;
    --sh:none;}}
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .mono{font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);
    border-bottom:1px solid var(--line)}
  .top .inner{max-width:1200px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
  .brand b{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:26px;
    letter-spacing:.055em;text-transform:uppercase;line-height:1}
  .brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .ctl{display:flex;gap:8px;align-items:center}
  select,input{font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--line2);
    border-radius:9px;padding:7px 10px}
  input[type=number]{width:92px;text-align:center}
  button{font:inherit;font-weight:500;cursor:pointer;background:var(--surface2);color:var(--ink);
    border:1px solid var(--line2);border-radius:9px;padding:7px 13px;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.07);color:#fff}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- layout ---------- */
  .wrap{max-width:1200px;margin:0 auto;padding:20px 18px 90px}
  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px}
  .note{color:var(--muted);font-size:13px}
  .err{color:var(--live);font-size:13px}

  /* ---------- summary strip ---------- */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:16px}
  .stat{background:var(--surface);padding:14px 16px}
  .stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:600}

  /* ---------- scoreboard ---------- */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
  .gm{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--surface2);position:relative}
  .gm.livegame{border-color:var(--live)}
  .tm{display:flex;align-items:center;gap:8px;padding:3px 0}
  .tm img{width:22px;height:22px;object-fit:contain;flex:none}
  .tm .ab{font-weight:600;font-size:14px}
  .tm .rec{font-size:11px;color:var(--muted)}
  .tm .pts{margin-left:auto;font-weight:700;font-size:17px}
  .tm.lost{opacity:.5}
  .gm .foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;
    padding-top:7px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);
    margin-right:5px;animation:p 1.6s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .foot .live{color:var(--live);font-weight:700}

  /* ---------- tables ---------- */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
  th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    font-weight:700;text-align:left;padding:0 10px 8px;white-space:nowrap}
  td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover td{background:var(--surface2)}
  tr.me td{background:var(--me-soft)!important;font-weight:600}
  .rank{font-family:"Barlow Condensed",Inter,sans-serif;font-size:19px;font-weight:700;color:var(--muted);width:34px}
  tr:nth-child(1) .rank{color:var(--gold)}
  .big{font-family:"Barlow Condensed",Inter,sans-serif;font-size:21px;font-weight:700}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
    background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
  .chip.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .chip.no{background:var(--live-soft);border-color:transparent;color:var(--live)}

  /* ---------- pick grid ---------- */
  .grid th.col{text-align:center;padding:0 2px 8px}
  .grid th.col img{width:17px;height:17px;object-fit:contain;display:block;margin:0 auto}
  .grid th.col .v{font-size:9px;color:var(--muted);line-height:1.4}
  .grid td{text-align:center;font-size:11.5px;padding:5px 4px;font-weight:600}
  .grid td.hit{background:var(--accent-soft);color:var(--accent)}
  .grid td.miss{background:var(--live-soft);color:var(--live);font-weight:400}
  .grid td.who{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;font-weight:600;font-size:13px}
  .grid tr.me td.who{background:var(--me-soft)}
  .grid tr:hover td.who{background:var(--surface2)}

  /* ---------- winner ---------- */
  .champ{display:flex;align-items:center;gap:14px}
  .champ .cup{font-size:34px;line-height:1}
  .champ .nm{font-family:"Barlow Condensed",Inter,sans-serif;font-size:32px;font-weight:700;line-height:1.1}

  /* ---------- manager ---------- */
  #drop{border:1.5px dashed var(--line2);border-radius:12px;padding:30px 20px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s;font-size:14px}
  #drop:hover{border-color:var(--accent);color:var(--accent)}
  #drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .ovrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
  .ovrow .lbl{min-width:168px;font-size:13px;color:var(--muted)}
  .ovrow button{padding:4px 10px;font-size:12.5px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  ul.path{margin:8px 0 0;padding-left:18px;font-size:13.5px}
  ul.path li{margin-bottom:4px}
  ul.path b{color:var(--ink)}
  @media (max-width:640px){
    .wrap{padding:16px 12px 80px}
    section{padding:14px}
    .brand b{font-size:22px}
  }
</style>
</head>
<body>

<header class="top"><div class="inner">
  <div class="brand"><b>Pick'em Pool</b><span id="seasonTag">2026</span></div>
  <div class="ctl">
    <select id="weekSel" aria-label="Week"></select>
    <select id="who" aria-label="Your name"><option value="">Scoring as…</option></select>
    <button id="mgrBtn">Manager</button>
  </div>
</div></header>

<div class="wrap">
  <div class="strip" id="strip"></div>

  <section>
    <p class="eyebrow">Scoreboard <span id="refreshTag" class="note" style="text-transform:none;letter-spacing:0;font-weight:400"></span></p>
    <div class="board" id="board"></div>
  </section>

  <section id="winCard" hidden>
    <p class="eyebrow">Result</p>
    <div id="winner"></div>
  </section>

  <section>
    <p class="eyebrow">Standings</p>
    <div class="scroll"><table id="standings"></table></div>
  </section>

  <section id="pathCard">
    <p class="eyebrow">Who can still catch you</p>
    <div id="path" class="note">Pick your name in the top bar.</div>
  </section>

  <section id="mgr" hidden>
    <p class="eyebrow">League manager</p>
    <div class="ctl" style="margin-bottom:12px">
      <input type="password" id="pass" placeholder="Manager passcode" autocomplete="off">
      <span class="note">Saved on this device only.</span>
    </div>
    <div id="drop">Drag pick-sheet photos here &nbsp;·&nbsp; or click to choose
      <input type="file" id="file" accept="image/*" multiple hidden></div>
    <p class="note" id="readMsg" style="margin:9px 0 0"></p>
    <div id="review"></div>
    <div class="bar">
      <label class="note"><input type="checkbox" id="reqPaid" style="vertical-align:-2px"> Unpaid entries can't win</label>
      <button id="save" class="primary">Save changes</button>
      <span class="note" id="saveMsg"></span>
    </div>
    <p class="note" style="margin:14px 0 0">Results come from the live feed. Override a game only if the feed is wrong.</p>
    <div id="overrides"></div>
  </section>

  <section>
    <p class="eyebrow">Every pick</p>
    <div class="scroll"><table class="grid" id="grid"></table></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const slug = n => String(n).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-");

let week = Number(new URLSearchParams(location.search).get("week") || 5);
let scores = {games:[]}, pool = null, pending = null;
let me = localStorage.getItem("pickem.me") || "";
let pass = localStorage.getItem("pickem.pass") || "";

for (let w = 1; w <= 18; w++) {
  const o = document.createElement("option");
  o.value = w; o.textContent = "Week " + w;
  $("weekSel").appendChild(o);
}
$("weekSel").value = week;

async function load() {
  try {
    const [s, p] = await Promise.all([
      fetch(`/api/scores?week=${week}`).then(r => r.json()),
      fetch(`/api/pool?week=${week}`).then(r => r.json())
    ]);
    if (!s.error) scores = s;
    if (p.error) { $("board").innerHTML = `<p class="err">${esc(p.error)}</p>`; return; }
    pool = p;
    if (s.season) $("seasonTag").textContent = s.season;
    render();
    $("refreshTag").textContent = "· updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  } catch (e) {
    $("board").innerHTML = '<p class="err">Couldn\'t reach the server. Retrying…</p>';
  }
}

const games = () => scores.games || [];
const winnerOf = g => (pool?.manualResults?.[g.id]) || g.winner;

function scoreOf(entry) {
  let c = 0, rem = 0;
  for (const g of games()) {
    const w = winnerOf(g), p = entry.picks?.[g.id];
    if (!w) { if (p) rem++; }
    else if (w !== "TIE" && p === w) c++;
  }
  return { correct: c, remaining: rem, max: c + rem };
}

function render() {
  const rows = (pool.entries || []).map(e => ({ e, s: scoreOf(e) }))
    .sort((a, b) => b.s.correct - a.s.correct || a.e.name.localeCompare(b.e.name));
  const top = rows.length ? Math.max(...rows.map(r => r.s.correct)) : 0;

  const sel = $("who"), names = (pool.entries || []).map(e => e.name);
  if (sel.options.length !== names.length + 1)
    sel.innerHTML = '<option value="">Scoring as…</option>' + names.map(n => `<option>${esc(n)}</option>`).join("");
  sel.value = me;

  renderStrip(rows, top);
  renderBoard();
  renderStandings(rows, top);
  renderPath(rows);
  renderWinner(rows);
  renderGrid(rows);
  if (!$("mgr").hidden) renderManager();
}

function renderStrip(rows, top) {
  const final = games().filter(g => winnerOf(g)).length;
  const live = games().filter(g => g.state === "in").length;
  const mine = rows.find(r => r.e.name === me);
  const rank = mine ? rows.findIndex(r => r.e.name === me) + 1 : null;
  const cells = [
    ["Week", `${week}`],
    ["Games", `${final}<small>/${games().length}</small>`],
    ["In progress", live ? `<span style="color:var(--live)">${live}</span>` : "0"],
    ["Entries", `${(pool.entries || []).length}`],
  ];
  if (mine) {
    cells.push(["Your record", `${mine.s.correct}<small>-${final - mine.s.correct}</small>`]);
    cells.push(["Your rank", `${rank}${rank === 1 && mine.s.correct === top ? "" : ""}`]);
  }
  $("strip").innerHTML = cells.map(([k, v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v mono">${v}</div></div>`).join("");
}

function renderBoard() {
  if (!games().length) { $("board").innerHTML = '<p class="note">No games found for this week.</p>'; return; }
  $("board").innerHTML = games().map(g => {
    const w = winnerOf(g);
    const row = (ab, name, logo, pts, rec) => {
      const lost = w && w !== "TIE" && w !== ab;
      return `<div class="tm${lost ? " lost" : ""}">
        ${logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : ""}
        <span class="ab">${esc(ab)}</span>
        <span class="rec">${esc(rec || "")}</span>
        <span class="pts mono">${g.state === "pre" ? "" : pts}</span></div>`;
    };
    const foot = g.state === "in"
      ? `<span class="live"><span class="dot"></span>Q${g.period} ${esc(g.clock)}</span>`
      : g.final ? `<span>${w === "TIE" ? "Final · tie" : "Final"}</span>`
                : `<span>${esc(g.detail)}</span>`;
    const extra = !g.final && g.weather ? `<span>${esc(g.weather.text)} ${g.weather.temp}°</span>` : "";
    return `<div class="gm${g.state === "in" ? " livegame" : ""}">
      ${row(g.away, g.awayName, g.awayLogo, g.awayScore, g.awayRecord)}
      ${row(g.home, g.homeName, g.homeLogo, g.homeScore, g.homeRecord)}
      <div class="foot">${foot}${extra}</div></div>`;
  }).join("");
}

function renderStandings(rows, top) {
  $("standings").innerHTML =
    `<thead><tr><th></th><th>Name</th><th class="n">Correct</th><th class="n">Left</th>
     <th class="n">Max</th><th class="n">TB</th><th>Paid</th><th>Status</th></tr></thead><tbody>` +
    rows.map((r, i) => `<tr class="${r.e.name === me ? "me" : ""}" data-name="${esc(r.e.name)}">
      <td class="rank">${i + 1}</td>
      <td>${esc(r.e.name)}</td>
      <td class="n big">${r.s.correct}</td>
      <td class="n mono">${r.s.remaining}</td>
      <td class="n mono">${r.s.max}</td>
      <td class="n mono">${r.e.tiebreaker ?? "—"}</td>
      <td><span class="chip ${r.e.paid ? "ok" : "no"}">${r.e.paid ? "paid" : "unpaid"}</span></td>
      <td>${r.s.max < top ? '<span class="chip no">eliminated</span>'
          : i === 0 ? '<span class="chip ok">leading</span>' : ""}</td></tr>`).join("") + "</tbody>";
}

function renderPath(rows) {
  const mine = (pool.entries || []).find(e => e.name === me);
  if (!mine) { $("path").innerHTML = '<p class="note">Pick your name in the top bar.</p>'; return; }
  const my = scoreOf(mine);
  const open = games().filter(g => !winnerOf(g));
  if (!open.length) {
    $("path").innerHTML = `<p class="note">All games final. You finished ${my.correct}-${games().length - my.correct}.</p>`;
    return;
  }
  const threats = (pool.entries || []).filter(e => e.name !== me).map(e => {
    const s = scoreOf(e);
    const diffs = open.filter(g => e.picks?.[g.id] && mine.picks?.[g.id] && e.picks[g.id] !== mine.picks[g.id]);
    return { e, s, diffs, pass: s.correct + diffs.length > my.correct, tie: s.correct + diffs.length === my.correct };
  }).filter(t => t.pass || t.tie).sort((a, b) => b.s.correct - a.s.correct || a.diffs.length - b.diffs.length);

  $("path").innerHTML = threats.length
    ? `<p class="note">You're at <b style="color:var(--ink)">${my.correct}</b> with ${open.length} game${open.length > 1 ? "s" : ""} open.</p><ul class="path">` +
      threats.map(t => `<li>${esc(t.e.name)} (${t.s.correct}) ${t.pass ? "passes" : "ties"} you only if ` +
        (t.diffs.map(g => `<b>${esc(t.e.picks[g.id])}</b>`).join(", ") || "nothing changes") +
        ` win${t.diffs.length === 1 ? "s" : ""}</li>`).join("") + "</ul>"
    : `<p class="note" style="color:var(--accent);font-weight:600">Nobody can catch you.</p>`;
}

function renderWinner(rows) {
  const open = games().filter(g => !winnerOf(g));
  const field = rows.filter(r => !pool.requirePaid || r.e.paid);
  if (!field.length) { $("winCard").hidden = true; return; }
  $("winCard").hidden = false;
  const top = Math.max(...field.map(r => r.s.correct));
  const tied = field.filter(r => r.s.correct === top);
  if (open.length) {
    $("winner").innerHTML = `<p class="note">${open.length} game${open.length > 1 ? "s" : ""} left · leader${tied.length > 1 ? "s" : ""}
      <b style="color:var(--ink)">${tied.map(r => esc(r.e.name)).join(", ")}</b> at ${top}</p>`;
    return;
  }
  if (tied.length === 1) {
    $("winner").innerHTML = `<div class="champ"><span class="cup">&#127942;</span><div>
      <div class="nm">${esc(tied[0].e.name)}</div>
      <div class="note">Wins at ${top}-${games().length - top} · no tiebreaker needed</div></div></div>`;
    return;
  }
  const tb = games().find(g => g.id === pool.tiebreakerGameId) ||
             [...games()].sort((a, b) => new Date(b.kickoff) - new Date(a.kickoff))[0];
  const actual = tb && tb.final ? tb.homeScore + tb.awayScore : null;
  if (actual == null) {
    $("winner").innerHTML = `<div class="champ"><span class="cup">&#9203;</span><div>
      <div class="nm">${tied.length}-way tie at ${top}</div>
      <div class="note">${tied.map(r => `${esc(r.e.name)} (${r.e.tiebreaker ?? "—"})`).join(" · ")} — waiting on ${esc(tb ? tb.away + " at " + tb.home : "the tiebreaker")}</div></div></div>`;
    return;
  }
  const scored = tied.map(r => ({ r, d: Math.abs((r.e.tiebreaker ?? 9999) - actual) })).sort((a, b) => a.d - b.d);
  const champs = scored.filter(x => x.d === scored[0].d);
  $("winner").innerHTML = `<div class="champ"><span class="cup">&#127942;</span><div>
    <div class="nm">${champs.map(c => esc(c.r.e.name)).join(" &amp; ")}</div>
    <div class="note">${champs.length > 1 ? "Split" : "Wins"} at ${top}-${games().length - top} ·
      ${esc(tb.away)} at ${esc(tb.home)} totalled ${actual}</div></div></div>
    <p class="note" style="margin-top:10px">${scored.map(x => `${esc(x.r.e.name)} guessed ${x.r.e.tiebreaker ?? "—"} (off by ${x.d})`).join(" · ")}</p>`;
}

function renderGrid(rows) {
  const gs = games();
  $("grid").innerHTML =
    `<thead><tr><th class="who"></th>${gs.map(g => `<th class="col">
      ${g.awayLogo ? `<img src="${esc(g.awayLogo)}" alt="${esc(g.away)}" loading="lazy">` : esc(g.away)}
      <div class="v">at</div>
      ${g.homeLogo ? `<img src="${esc(g.homeLogo)}" alt="${esc(g.home)}" loading="lazy">` : esc(g.home)}
     </th>`).join("")}<th class="n">TB</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${r.e.name === me ? "me" : ""}"><td class="who">${esc(r.e.name)}</td>` +
      gs.map(g => {
        const p = r.e.picks?.[g.id] || "", w = winnerOf(g);
        const cls = !w || !p || w === "TIE" ? "" : (p === w ? "hit" : "miss");
        return `<td class="${cls}">${esc(p)}</td>`;
      }).join("") + `<td class="n mono">${r.e.tiebreaker ?? ""}</td></tr>`).join("") + "</tbody>";
}

function renderManager() {
  $("reqPaid").checked = !!pool.requirePaid;
  $("overrides").innerHTML = games().map(g => {
    const o = pool.manualResults?.[g.id] || "";
    const b = (v, label) => `<button data-ov="${g.id}" data-v="${esc(v)}" class="${o === v ? "on" : ""}">${esc(label)}</button>`;
    return `<div class="ovrow"><span class="lbl">${esc(g.away)} at ${esc(g.home)}${g.final ? " · feed says " + esc(g.winner || "—") : ""}</span>
      ${b(g.away, g.away)}${b(g.home, g.home)}${b("TIE", "Tie")}${o ? `<button data-ov="${g.id}" data-v="">clear</button>` : ""}</div>`;
  }).join("");
  $("overrides").querySelectorAll("button[data-ov]").forEach(btn => btn.onclick = () => {
    pool.manualResults = pool.manualResults || {};
    if (btn.dataset.v) pool.manualResults[btn.dataset.ov] = btn.dataset.v;
    else delete pool.manualResults[btn.dataset.ov];
    render();
  });
  $("standings").querySelectorAll("tr[data-name]").forEach(tr => {
    tr.style.cursor = "pointer";
    tr.title = "Click to toggle paid";
    tr.onclick = () => {
      const e = pool.entries.find(x => x.name === tr.dataset.name);
      if (e) { e.paid = !e.paid; render(); }
    };
  });
}

$("weekSel").onchange = e => { week = Number(e.target.value); history.replaceState(null, "", `?week=${week}`); load(); };
$("who").onchange = e => { me = e.target.value; localStorage.setItem("pickem.me", me); render(); };
$("mgrBtn").onclick = () => {
  const m = $("mgr"); m.hidden = !m.hidden;
  $("pass").value = pass;
  if (!m.hidden) { if (pool) renderManager(); m.scrollIntoView({behavior:"smooth", block:"start"}); }
};
$("pass").oninput = e => { pass = e.target.value; localStorage.setItem("pickem.pass", pass); };
$("reqPaid").onchange = e => { pool.requirePaid = e.target.checked; render(); };

const drop = $("drop");
drop.onclick = () => $("file").click();
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => readFiles(Array.from(e.dataTransfer.files || [])));
$("file").onchange = e => readFiles(Array.from(e.target.files || []));

async function readFiles(files) {
  files = files.filter(f => f.type.startsWith("image/")).slice(0, 6);
  if (!files.length) return;
  if (!pass) { $("readMsg").innerHTML = '<span class="err">Enter the manager passcode first.</span>'; return; }
  $("readMsg").textContent = `Reading ${files.length} image${files.length > 1 ? "s" : ""}…`;
  const images = await Promise.all(files.map(f => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res({ media_type: f.type, data: fr.result.split(",")[1] });
    fr.onerror = rej; fr.readAsDataURL(f);
  })));
  try {
    const r = await fetch("/api/read-sheet", {
      method: "POST",
      headers: { "content-type": "application/json", "x-admin-key": pass },
      body: JSON.stringify({ images, games: games().map(g => ({ id: g.id, away: g.away, home: g.home })) })
    });
    const out = await r.json();
    if (!r.ok) { $("readMsg").innerHTML = `<span class="err">${esc(out.error || "Failed")}</span>`; return; }
    pending = out.entries || [];
    $("readMsg").textContent = `Read ${pending.length} entries — check the names, then add them.`;
    renderReview();
  } catch (e) { $("readMsg").innerHTML = '<span class="err">Upload failed.</span>'; }
}

function renderReview() {
  if (!pending?.length) { $("review").innerHTML = ""; return; }
  const gs = games();
  $("review").innerHTML = `<div class="scroll" style="margin-top:12px"><table class="grid"><thead><tr><th class="who">Name</th>` +
    gs.map(g => `<th class="col">${esc(g.away)}<div class="v">at</div>${esc(g.home)}</th>`).join("") +
    `<th class="n">TB</th></tr></thead><tbody>` +
    pending.map((p, i) => `<tr><td class="who"><input type="text" data-i="${i}" value="${esc(p.name)}" style="width:118px;padding:4px 7px"></td>` +
      gs.map(g => `<td>${esc(p.picks?.[g.id] || "?")}</td>`).join("") +
      `<td class="n mono">${p.tiebreaker ?? "?"}</td></tr>`).join("") + `</tbody></table></div>
      <div class="bar"><button class="primary" id="merge">Add these entries</button><button id="toss">Discard</button></div>`;
  $("review").querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => { pending[+inp.dataset.i].name = inp.value; });
  $("merge").onclick = () => {
    pool.entries = pool.entries || [];
    for (const p of pending) {
      if (!p.name.trim()) continue;
      const i = pool.entries.findIndex(e => slug(e.name) === slug(p.name));
      if (i >= 0) pool.entries[i] = { ...pool.entries[i], picks: p.picks, tiebreaker: p.tiebreaker };
      else pool.entries.push(p);
    }
    pending = null; $("review").innerHTML = "";
    $("readMsg").textContent = "Added. Hit Save changes to publish.";
    render();
  };
  $("toss").onclick = () => { pending = null; $("review").innerHTML = ""; $("readMsg").textContent = ""; };
}

$("save").onclick = async () => {
  if (!pass) { $("saveMsg").innerHTML = '<span class="err">Passcode required.</span>'; return; }
  $("saveMsg").textContent = "Saving…";
  try {
    const r = await fetch(`/api/pool?week=${week}`, {
      method: "POST",
      headers: { "content-type": "application/json", "x-admin-key": pass },
      body: JSON.stringify(pool)
    });
    const out = await r.json();
    if (r.ok) { pool = out; $("saveMsg").textContent = "Saved."; render(); }
    else $("saveMsg").innerHTML = `<span class="err">${esc(out.error)}</span>`;
  } catch (e) { $("saveMsg").innerHTML = '<span class="err">Save failed.</span>'; }
};

load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
