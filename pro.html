<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICK'EM NETWORK</title>
<meta name="theme-color" content="#04060B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060B; --deep:#070B13; --panel:rgba(10,16,26,.82); --line:rgba(255,255,255,.12);
  --ink:#F4F8FD; --ink2:#AFC0D4; --muted:#6C809A;
  --net:#E8232A;          /* network red */
  --net2:#FFC72C;         /* network gold */
  --cy1:#0B3B8C;          /* chyron blue */
  --cy2:#061F4D;
  --win:#39E27E; --lose:#FF5A52; --live:#FF3B30;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;
  line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
.cond{font-family:"Barlow Condensed",Oswald,sans-serif;letter-spacing:.01em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink2);
  border-radius:3px;padding:6px 11px;font-family:"Barlow Condensed",sans-serif;font-size:14px;
  letter-spacing:.09em;text-transform:uppercase;transition:.14s}
button:hover{background:var(--net);border-color:var(--net);color:#fff}
select{background:rgba(6,10,18,.9);border:1px solid var(--line);border-radius:3px;padding:6px 9px;
  font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.07em;text-transform:uppercase}

/* ---------- studio atmosphere ---------- */
/* the shot: crowd in the dark, lit field below, camera haze over the top */
.studio{position:fixed;inset:0;z-index:-5;background:#060910}
.crowd{position:fixed;left:0;right:0;top:0;height:46%;z-index:-4;filter:blur(2.5px) brightness(.62);
  background:
    radial-gradient(circle at 12% 30%, rgba(255,255,255,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 34% 58%, rgba(255,210,150,.09) 0 2px, transparent 3px),
    radial-gradient(circle at 61% 24%, rgba(180,210,255,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 52%, rgba(255,255,255,.07) 0 2px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,#0A0F19 0%, #0C1420 60%, #0A1119 100%);
  background-size:140px 90px,170px 110px,150px 95px,190px 120px,auto,auto,auto}
.lights{position:fixed;inset:0;z-index:-4;pointer-events:none;
  background:
    radial-gradient(420px 220px at 14% 6%, rgba(255,245,215,.16), transparent 70%),
    radial-gradient(420px 220px at 50% 2%, rgba(255,245,215,.13), transparent 70%),
    radial-gradient(420px 220px at 86% 6%, rgba(255,245,215,.16), transparent 70%)}
.pitch{position:fixed;left:-30%;right:-30%;bottom:-18%;height:72%;z-index:-3;
  transform:perspective(760px) rotateX(63deg);transform-origin:50% 100%;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 3px, transparent 3px 86px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 17px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 60px, transparent 60px 120px),
    linear-gradient(180deg,#1C5C33 0%, #174E2C 55%, #10381F 100%);
  box-shadow:inset 0 60px 120px rgba(0,0,0,.55)}
.pitch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11%;
  background:linear-gradient(90deg,#8A1C22,#6E161B);opacity:.75}
.pitch::after{content:"";position:absolute;right:0;top:0;bottom:0;width:11%;
  background:linear-gradient(90deg,#17386E,#122C57);opacity:.75}
.haze{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg, rgba(6,10,18,.72) 0%, rgba(6,10,18,.30) 38%, rgba(4,7,13,.78) 100%)}
.scan{position:fixed;inset:0;z-index:48;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:47;pointer-events:none;
  background:radial-gradient(120% 85% at 50% 45%, transparent 55%, rgba(0,0,0,.72))}

/* ---------- gate: colour bars ---------- */
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#05070C}
#gate .bars{position:absolute;inset:0;display:flex;opacity:.22}
#gate .bars i{flex:1}
#gate .box{position:relative;text-align:center;border:1px solid var(--line);background:rgba(6,10,18,.9);
  padding:34px 30px;min-width:min(380px,92vw)}
#gate .net{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}
#gate .net .mk{background:var(--net);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:20px;
  padding:3px 9px;letter-spacing:.08em}
#gate h1{font-family:"Barlow Condensed";font-weight:700;font-size:40px;margin:0;letter-spacing:.06em}
#gate p{color:var(--muted);font-family:"Barlow Condensed";letter-spacing:.3em;text-transform:uppercase;
  font-size:12px;margin:2px 0 20px}
#gate input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:3px;padding:12px;
  text-align:center;letter-spacing:.34em;font-family:"IBM Plex Mono",monospace;margin-bottom:12px}
#gate .err{color:var(--live);font-family:"Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;
  font-size:12px;min-height:16px;margin-top:8px}

/* ---------- broadcast frame ---------- */
.air{display:none;position:fixed;inset:0;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);
  overflow:hidden}
.air>*{min-width:0}
.air.on{display:grid}

/* top: scorebug strip */
.bug{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(6,10,18,.95),rgba(6,10,18,.7));backdrop-filter:blur(10px);
  padding-top:env(safe-area-inset-top,0px)}
.bug .net{display:flex;align-items:center;gap:9px;padding:9px 14px;border-right:1px solid var(--line)}
.bug .net .mk{background:var(--net);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:17px;
  padding:2px 8px;letter-spacing:.07em}
.bug .net .nm{font-family:"Barlow Condensed";font-size:15px;letter-spacing:.17em;color:var(--ink2)}
.bug .live{display:flex;align-items:center;gap:7px;padding:0 14px;border-right:1px solid var(--line);
  font-family:"Barlow Condensed";font-size:14px;letter-spacing:.16em;color:var(--live)}
.bug .live .tally{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live);
  animation:tal 1.3s steps(1,end) infinite}
@keyframes tal{0%,60%{opacity:1}61%,100%{opacity:.2}}
.bug .mid{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:0 16px;overflow:hidden}
.bug .mid .wk{font-family:"Barlow Condensed";font-weight:700;font-size:26px;letter-spacing:.04em}
.bug .mid .sub{font-family:"Barlow Condensed";font-size:13px;letter-spacing:.16em;color:var(--muted);
  text-transform:uppercase}
.bug .ctl{display:flex;align-items:center;gap:7px;padding:0 12px;border-left:1px solid var(--line)}
.bug .clock{font-family:"IBM Plex Mono";font-size:13px;color:var(--ink2);padding:0 12px;border-left:1px solid var(--line);
  display:flex;align-items:center}

/* middle: stage */
.stage{position:relative;overflow:hidden;min-width:0}
.seg{position:absolute;inset:0;overflow:auto;padding:18px 20px 22px 92px;display:none}
.seg.on{display:block;animation:wipe .42s cubic-bezier(.22,.9,.25,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.4;transform:translateX(16px)}
  to{clip-path:inset(0 0 0 0);opacity:1;transform:none}}
.inner{max-width:1480px;margin:0 auto}

/* chyron headings */
.chyron{display:inline-flex;align-items:stretch;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.chyron .l{background:var(--net);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:16px;
  letter-spacing:.14em;padding:7px 13px;display:flex;align-items:center}
.chyron .r{background:linear-gradient(90deg,var(--cy1),var(--cy2));padding:7px 18px;display:flex;align-items:center;
  font-family:"Barlow Condensed";font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#fff}

/* scorebug cards */
.gamewall{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:12px}
.gcard{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,13,22,.94),rgba(5,8,14,.92));
  backdrop-filter:blur(6px);
  cursor:pointer;position:relative;overflow:hidden;transition:.15s}
.gcard:hover{border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.gcard .band{height:3px;background:linear-gradient(90deg,var(--cy1),var(--net))}
.gcard .rowt{display:flex;align-items:center;gap:10px;padding:9px 12px}
.gcard .rowt+.rowt{border-top:1px solid rgba(255,255,255,.06)}
.gcard .rowt img{width:28px;height:28px;object-fit:contain}
.gcard .rowt .ab{font-family:"Barlow Condensed";font-weight:600;font-size:19px;letter-spacing:.05em}
.gcard .rowt .sc{margin-left:auto;font-family:"Barlow Condensed";font-weight:700;font-size:26px}
.gcard .rowt.lose{opacity:.42}
.gcard .rowt .poss{width:0;height:0;border-left:6px solid var(--net2);border-top:4px solid transparent;
  border-bottom:4px solid transparent}
.gcard .strip{display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(0,0,0,.35);
  font-family:"Barlow Condensed";font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcard .strip .live{color:var(--live);font-weight:600}
.gcard .pool{display:flex;height:6px}
.gcard .pool i{display:block}
.gcard .pnums{display:flex;justify-content:space-between;padding:5px 12px 9px;font-family:"IBM Plex Mono";
  font-size:10.5px;color:var(--muted)}

/* leaderboard as broadcast graphic */
.lb{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,13,22,.94),rgba(5,8,14,.93));
  backdrop-filter:blur(6px)}
.lbr{display:grid;grid-template-columns:44px 1fr 92px 64px;align-items:center;gap:10px;
  padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;cursor:pointer}
.lbr:last-child{border-bottom:0}
.lbr:hover{background:rgba(255,255,255,.04)}
.lbr .rk{font-family:"Barlow Condensed";font-weight:700;font-size:22px;color:var(--muted);text-align:center;
  background:rgba(255,255,255,.05);border-radius:2px;padding:1px 0}
.lbr.p1 .rk{background:var(--net2);color:#1A1203}
.lbr.p2 .rk{background:#C9D4E2;color:#0B121C}
.lbr.p3 .rk{background:#C08A4E;color:#140C04}
.lbr .nm{font-family:"Barlow Condensed";font-size:21px;letter-spacing:.04em}
.lbr .meter{height:9px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.lbr .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cy1),#3C8DFF);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}
.lbr .val{font-family:"Barlow Condensed";font-weight:700;font-size:26px;text-align:right}
.lbr.me{box-shadow:inset 3px 0 0 var(--net2)}
.lbr.out{opacity:.45}

/* matrix */
.wall{overflow:auto;border:1px solid var(--line);max-height:calc(100vh - 290px);
  background:rgba(5,8,14,.9);backdrop-filter:blur(6px)}
.wall table{border-collapse:separate;border-spacing:2px;width:100%;font-family:"Barlow Condensed";font-size:13px}
.wall th{position:sticky;top:0;z-index:3;background:rgba(6,10,18,.96);padding:5px 2px;color:var(--muted);
  font-weight:500;letter-spacing:.06em}
.wall th img{width:19px;height:19px;object-fit:contain;display:block;margin:0 auto}
.wall th.who,.wall td.who{position:sticky;left:0;z-index:2;background:rgba(6,10,18,.96);text-align:left;
  padding-left:12px;min-width:106px;font-size:16px;letter-spacing:.04em;cursor:pointer}
.wall th.who{z-index:4;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.wall td{height:25px;text-align:center;border-radius:2px;letter-spacing:.05em}
.wall td.hit{background:linear-gradient(180deg,rgba(57,226,126,.45),rgba(57,226,126,.18));color:#EAFFF2}
.wall td.miss{background:rgba(255,90,82,.14);color:#FFC9C6}
.wall td.tie{background:rgba(255,199,44,.18);color:#FFE8A8}
.wall td.pend{background:rgba(255,255,255,.04);color:var(--muted)}

/* season chart */

/* bottom: ticker */
.ticker{min-width:0;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(6,10,18,.92),rgba(4,6,11,.98));
  display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom,0px)}
.ticker .tag{background:var(--net);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:15px;
  letter-spacing:.14em;display:flex;align-items:center;padding:0 14px;white-space:nowrap}
.ticker .crawl{flex:1;min-width:0;overflow:hidden;position:relative}
.ticker .crawl .run{display:inline-flex;gap:30px;padding:9px 0;white-space:nowrap;
  font-family:"Barlow Condensed";font-size:16px;letter-spacing:.05em;animation:crawl 46s linear infinite}
.ticker .crawl .run span b{color:var(--net2);font-weight:600}
.ticker .crawl .run span .w{color:var(--win)}
.ticker .crawl .run span .l{color:var(--lose)}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker:hover .run{animation-play-state:paused}

/* rundown / segment buttons */
.rundown{display:flex;flex-direction:column;gap:5px}
.rundown button{position:relative;padding:6px 13px}
.rundown button .n{color:var(--net2);margin-right:7px;font-weight:700}
.rundown button.on{background:linear-gradient(90deg,var(--cy1),var(--cy2));border-color:transparent;color:#fff}
.autoind{height:2px;background:var(--net2);width:0;position:absolute;left:0;bottom:0}

/* lower third */
#lower{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;justify-content:center;
  pointer-events:none;transform:translateY(130%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
#lower.on{transform:none}
#lower .l3{display:flex;align-items:stretch;box-shadow:0 18px 50px rgba(0,0,0,.6);max-width:min(860px,94vw)}
#lower .bar{width:7px;background:var(--net)}
#lower .main{background:linear-gradient(90deg,rgba(11,59,140,.97),rgba(6,31,77,.97));padding:12px 20px;flex:1}
#lower .main .k{font-family:"Barlow Condensed";font-size:12px;letter-spacing:.24em;color:var(--net2);text-transform:uppercase}
#lower .main .t{font-family:"Barlow Condensed";font-weight:700;font-size:30px;letter-spacing:.03em;line-height:1.05}
#lower .main .s{font-size:12.5px;color:#C9DAF2}
#lower .stat{background:rgba(4,8,16,.95);padding:12px 18px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;min-width:92px}
#lower .stat .v{font-family:"Barlow Condensed";font-weight:700;font-size:32px;line-height:1}
#lower .stat .k{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.18em;color:var(--muted)}
#lower #l3x{pointer-events:auto;border:0;border-left:1px solid rgba(255,255,255,.14);border-radius:0;
  background:rgba(4,8,16,.95);color:var(--muted);padding:0 14px;font-size:13px}
#lower #l3x:hover{background:var(--net);color:#fff}
#lower .l3{pointer-events:auto}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(2,4,8,.66);z-index:55;opacity:0;pointer-events:none;transition:.2s}
#scrim.on{opacity:1;pointer-events:auto}
#dock{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);z-index:60;transform:translateX(103%);
  transition:transform .26s cubic-bezier(.2,.85,.2,1);background:linear-gradient(180deg,rgba(8,13,22,.98),rgba(4,7,12,.99));
  border-left:1px solid var(--line);display:flex;flex-direction:column}
#dock.on{transform:none}
#dock .hd{padding:18px 18px 14px calc(18px);border-bottom:1px solid var(--line)}
#dock .bd{overflow:auto;padding:16px 18px 40px}
.sub2{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  margin:16px 0 7px}
.names{list-style:none;margin:0;padding:0;columns:2;font-family:"Barlow Condensed";font-size:16px}
.names li.hit{color:var(--win)}.names li.miss{color:var(--lose);opacity:.8}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.pl{border:1px solid var(--line);text-align:center;padding:6px 0;border-radius:2px}
.pl img{width:20px;height:20px;object-fit:contain}
.pl.hit{background:rgba(57,226,126,.26);border-color:rgba(57,226,126,.5)}
.pl.miss{opacity:.4}
.empty{padding:40px;text-align:center;color:var(--muted);font-family:"Barlow Condensed";letter-spacing:.14em;
  text-transform:uppercase}
@media (max-width:760px){
  .bug .net .nm,.bug .clock{display:none}
  .bug .mid .wk{font-size:21px}
  .seg{padding:14px 12px 18px}
  .rundown{position:fixed!important;left:0!important;right:0;top:auto!important;bottom:calc(60px + env(safe-area-inset-bottom,0px))!important;
    transform:none!important;flex-direction:row!important;overflow-x:auto;padding:0 10px;gap:6px}
  .rundown button{white-space:nowrap}
  .gamewall{grid-template-columns:1fr}
  .lbr{grid-template-columns:34px 1fr 64px 48px}
  #lower{bottom:58px}
  #lower .main .t{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.sweep,.ticker .run,.bug .live .tally{animation:none}}
</style>
</head>
<body>
<div class="studio"></div><div class="crowd"></div><div class="lights"></div>
<div class="pitch"></div><div class="haze"></div><div class="scan"></div><div class="vig"></div>

<div id="gate">
  <div class="bars">
    <i style="background:#C0C0C0"></i><i style="background:#C0C000"></i><i style="background:#00C0C0"></i>
    <i style="background:#00C000"></i><i style="background:#C000C0"></i><i style="background:#C00000"></i>
    <i style="background:#0000C0"></i>
  </div>
  <div class="box">
    <div class="net"><span class="mk">PN</span></div>
    <h1>PICK'EM NETWORK</h1>
    <p>Control room access</p>
    <input type="password" id="gpass" placeholder="PASSCODE" autocomplete="off">
    <button id="gbtn" style="width:100%;padding:11px">Go to air</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<div class="air" id="air">
  <div class="bug">
    <div class="net"><span class="mk">PN</span><span class="nm">PICK'EM NETWORK</span></div>
    <div class="live" id="liveFlag"><span class="tally"></span><span id="liveTxt">ON AIR</span></div>
    <div class="mid"><span class="wk" id="wk">WEEK —</span><span class="sub" id="sub">standby</span></div>
    <div class="clock mono" id="clock">--:--</div>
    <div class="ctl">
      <select id="weekSel"></select>
      <select id="meSel"><option value="">Follow…</option></select>
      <button id="autoBtn">Auto</button>
    </div>
  </div>

  <div class="stage">
    <div class="seg on" id="s-wall"><div class="inner">
      <div class="chyron"><span class="l">LIVE</span><span class="r" id="wallTitle">Around the League</span></div>
      <div class="gamewall" id="wall"></div>
    </div></div>

    <div class="seg" id="s-board"><div class="inner">
      <div class="chyron"><span class="l">WEEK</span><span class="r">Leaderboard</span></div>
      <div class="lb" id="board"></div>
    </div></div>

    <div class="seg" id="s-matrix"><div class="inner">
      <div class="chyron"><span class="l">CARDS</span><span class="r">Every Pick on File</span></div>
      <div class="wall" id="matrix"></div>
    </div></div>

    <div class="seg" id="s-season"><div class="inner">
      <div class="chyron"><span class="l">SEASON</span><span class="r">Standings to Date</span></div>
      <div class="wall" id="seasonTbl"></div>
    </div></div>
  </div>

  <div class="ticker">
    <span class="tag">SCORES</span>
    <div class="crawl"><div class="run" id="crawl"></div></div>
  </div>
</div>

<div id="lower"><div class="l3"><div class="bar"></div>
  <div class="main"><div class="k" id="l3k">Now</div><div class="t" id="l3t">—</div><div class="s" id="l3s"></div></div>
  <div class="stat"><div class="v" id="l3v">0</div><div class="k" id="l3l">PTS</div></div>
  <button id="l3x" title="Clear">✕</button>
</div></div>

<div id="scrim"></div>
<div id="dock"><div class="hd" id="dHd"></div><div class="bd" id="dBd"></div></div>

<div style="position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:46" class="rundown" id="rundown"></div>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const tc=n=>String(n??"").toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());
const up=n=>String(n??"").toUpperCase();
const slug=n=>String(n).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-");

let pass=localStorage.getItem("pc.pass")||"", week=0, scores={games:[]}, pool=null, season=null;
let me=localStorage.getItem("pc.me")||"", seg="wall", auto=false, autoTimer=null, lowerShown=false;

const SEGS=[["wall","Around the League"],["board","Leaderboard"],["matrix","Every Pick"],
            ["season","Season Standings"]];

async function getJSON(u,o){const r=await fetch(u,o);const t=await r.text();
  try{return{ok:r.ok,body:JSON.parse(t)};}catch(e){return{ok:false,body:{}};}}
const unlock=async c=>(await fetch("/api/pool?auth=1",{method:"POST",headers:{"x-admin-key":c}})).ok;

$("gbtn").onclick=async()=>{
  const v=$("gpass").value.trim(); $("gerr").textContent="";
  if(!v)return;
  if(!(await unlock(v))){$("gerr").textContent="Access denied";return;}
  pass=v; localStorage.setItem("pc.pass",pass);
  $("gate").style.display="none"; $("air").classList.add("on"); boot();
};
$("gpass").onkeydown=e=>{if(e.key==="Enter")$("gbtn").click();};
(async()=>{if(pass&&await unlock(pass)){$("gate").style.display="none";$("air").classList.add("on");boot();}})();

for(let w=1;w<=18;w++){const o=document.createElement("option");o.value=w;o.textContent="WK "+w;$("weekSel").appendChild(o);}
$("weekSel").onchange=e=>{week=+e.target.value;load();};
$("meSel").onchange=e=>{ me=e.target.value; localStorage.setItem("pc.me",me); lowerShown=false; render(); };

$("rundown").innerHTML=SEGS.map(([k,l],i)=>
  `<button data-s="${k}" class="${k===seg?"on":""}"><span class="n">${i+1}</span>${up(l)}<i class="autoind"></i></button>`).join("");
$("rundown").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>show(b.dataset.s));
document.addEventListener("keydown",e=>{
  const n=parseInt(e.key,10);
  if(n>=1&&n<=SEGS.length&&!/input|select|textarea/i.test(document.activeElement.tagName)) show(SEGS[n-1][0]);
  if(e.key==="Escape"){closeDock();}
});
function show(k){
  seg=k;
  SEGS.forEach(([s])=>$("s-"+s).classList.toggle("on",s===k));
  $("rundown").querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===k));
  render();
}
$("autoBtn").onclick=()=>{
  auto=!auto;
  $("autoBtn").textContent=auto?"Auto ·":"Auto";
  $("autoBtn").style.background=auto?"var(--net)":"";
  $("autoBtn").style.color=auto?"#fff":"";
  clearInterval(autoTimer);
  if(auto) autoTimer=setInterval(()=>{
    const i=SEGS.findIndex(([k])=>k===seg); show(SEGS[(i+1)%SEGS.length][0]);
  },11000);
};
setInterval(()=>{ $("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"}); },1000);

function boot(){load();loadSeason();setInterval(()=>{if(!document.hidden)load();},30000);}
async function load(){
  const s=await getJSON(week?`/api/scores?week=${week}`:"/api/scores");
  if(s.ok){scores=s.body;if(!week&&s.body.week){week=+s.body.week;$("weekSel").value=week;}}
  const p=await getJSON(`/api/pool?week=${week||1}`);
  pool=p.ok?p.body:null; render();
}
async function loadSeason(){const s=await getJSON("/api/season");season=s.ok?s.body:null;render();}

const games=()=>scores.games||[];
const entries=()=>pool?.entries||[];
const winnerOf=g=>pool?.manualResults?.[g.id]||g.winner;
function scoreOf(e){let c=0,rem=0;
  for(const g of games()){const w=winnerOf(g),p=e.picks?.[g.id];
    if(!w){if(p)rem++;}else if(w!=="TIE"&&p===w)c++;}
  return{c,rem,max:c+rem};}
const ranked=()=>entries().map(e=>({e,s:scoreOf(e)})).sort((a,b)=>b.s.c-a.s.c||a.e.name.localeCompare(b.e.name));
const splitOf=g=>{const r=entries();
  const a=r.filter(e=>e.picks?.[g.id]===g.away).length,h=r.filter(e=>e.picks?.[g.id]===g.home).length;
  return{a,h,tot:Math.max(a+h,1)};};

function render(){
  const gs=games(),finals=gs.filter(g=>winnerOf(g)).length,live=gs.filter(g=>g.state==="in").length;
  $("wk").textContent=`WEEK ${week||"—"}`;
  $("sub").textContent=`${entries().length} cards · ${finals} of ${gs.length} final`;
  $("liveTxt").textContent=live?`${live} LIVE`:"ON AIR";
  $("liveFlag").style.color=live?"var(--live)":"var(--muted)";
  const names=entries().map(e=>e.name).sort((a,b)=>a.localeCompare(b));
  if($("meSel").options.length!==names.length+1)
    $("meSel").innerHTML='<option value="">Follow…</option>'+names.map(n=>`<option value="${esc(n)}">${esc(up(n))}</option>`).join("");
  $("meSel").value=me;

  drawCrawl();
  if(seg==="wall")drawWall();
  if(seg==="board")drawBoard();
  if(seg==="matrix")drawMatrix();
  if(seg==="season")drawSeason();
  if(me && !lowerShown){ lowerShown=true; showLower(); }
}

function drawCrawl(){
  const gs=games(),rows=ranked();
  const bits=[];
  gs.forEach(g=>{const w=winnerOf(g);
    const a=`${g.away} ${g.state==="pre"?"":g.awayScore}`,h=`${g.home} ${g.state==="pre"?"":g.homeScore}`;
    const tail=g.state==="in"?` <b>Q${g.period} ${g.clock}</b>`:w?(w==="TIE"?" FINAL/TIE":" FINAL"):
      ` ${new Date(g.kickoff).toLocaleString([],{weekday:"short",hour:"numeric"})}`;
    bits.push(`<span>${esc(a)} &nbsp;·&nbsp; ${esc(h)}${tail}</span>`);});
  rows.slice(0,6).forEach((r,i)=>bits.push(`<span><b>${i+1}.</b> ${esc(up(r.e.name))} ${r.s.c}</span>`));
  if(!bits.length)bits.push("<span>NO GAMES ON THE BOARD</span>");
  const once=bits.join("");
  $("crawl").innerHTML=once+once;   // doubled so the loop is seamless
}

function drawWall(){
  const gs=games();
  $("wallTitle").textContent=gs.length?`${gs.length} Games`:"No Games";
  if(!gs.length){$("wall").innerHTML='<div class="empty">Nothing scheduled</div>';return;}
  $("wall").innerHTML=gs.map(g=>{
    const w=winnerOf(g),live=g.state==="in",sp=splitOf(g);
    const row=(ab,sc,logo)=>`<div class="rowt${w&&w!=="TIE"&&w!==ab?" lose":""}">
      ${logo?`<img src="${esc(logo)}" alt="">`:""}<span class="ab">${esc(ab)}</span>
      ${live&&g.possession===ab?'<span class="poss"></span>':""}
      <span class="sc">${g.state==="pre"?"–":sc}</span></div>`;
    const strip=live?`<span class="live">● Q${g.period} ${esc(g.clock)}</span>`
      :w?`<span>${w==="TIE"?"Final · tie":"Final"}</span>`
      :`<span>${new Date(g.kickoff).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})}</span>`;
    return `<div class="gcard" data-g="${esc(g.id)}"><div class="band"></div>
      ${row(g.away,g.awayScore,g.awayLogo)}${row(g.home,g.homeScore,g.homeLogo)}
      <div class="strip">${strip}</div>
      <div class="pool">
        <i style="width:${sp.a/sp.tot*100}%;background:${w===g.away?"var(--win)":"var(--cy1)"}"></i>
        <i style="width:${sp.h/sp.tot*100}%;background:${w===g.home?"var(--win)":"rgba(255,255,255,.18)"}"></i></div>
      <div class="pnums"><span>${sp.a} ${esc(g.away)}</span><span>${esc(g.home)} ${sp.h}</span></div></div>`;
  }).join("");
  $("wall").querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>openGame(el.dataset.g));
}

function lbRow(i,name,val,maxv,note,out){
  return `<div class="lbr${i<3?" p"+(i+1):""}${slug(name)===slug(me)?" me":""}${out?" out":""}" data-p="${esc(name)}">
    <div class="rk">${i+1}</div><div class="nm">${esc(up(name))}</div>
    <div class="meter"><i style="width:${(val/Math.max(maxv,1)*100).toFixed(1)}%"></i></div>
    <div class="val">${val}</div></div>`;
}
function drawBoard(){
  const rows=ranked();
  if(!rows.length){$("board").innerHTML='<div class="empty">No cards filed</div>';return;}
  const top=rows[0].s.c;
  $("board").innerHTML=rows.map((r,i)=>lbRow(i,r.e.name,r.s.c,top,"",r.s.max<top)).join("");
  $("board").querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>openPlayer(el.dataset.p));
}
function drawSeason(){
  if(!season||!season.players?.length){ $("seasonTbl").innerHTML='<div class="empty">No season data yet</div>'; return; }
  const ws=season.weeks.map(w=>w.week);
  const ps=[...season.players].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
  const winnersOf=w=>(season.weeks.find(x=>x.week===w)?.winners)||[];
  $("seasonTbl").innerHTML=`<table><thead><tr>
      <th class="who">Player</th><th>Total</th><th>Avg</th><th>Weeks</th><th>Won</th>`+
      ws.map(w=>`<th>W${w}</th>`).join("")+`</tr></thead><tbody>`+
    ps.map((p,i)=>`<tr><td class="who" data-p="${esc(p.name)}">
        <span style="color:var(--muted);margin-right:8px">${i+1}</span>${esc(up(p.name))}</td>
      <td style="font-weight:700;font-size:17px">${p.total}</td>
      <td>${(p.total/Math.max(p.weeks,1)).toFixed(1)}</td>
      <td>${p.weeks}/${ws.length}</td>
      <td style="color:${p.wins?"var(--net2)":"var(--muted)"};font-weight:${p.wins?700:400}">${p.wins||"—"}</td>`+
      ws.map(w=>{ const v=p.byWeek[w];
        const won=winnersOf(w).some(n=>slug(n)===slug(p.name));
        return `<td class="${won?"hit":v==null?"pend":""}">${v??"·"}</td>`; }).join("")+
      `</tr>`).join("")+`</tbody>`;
  $("seasonTbl").querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>openPlayer(el.dataset.p));
}

/* lower third follows the player you're tracking */
let lowerTimer=null;
function hideLower(){ $("lower").classList.remove("on"); clearTimeout(lowerTimer); }
function showLower(){
  if(!me){ hideLower(); return; }
  const row=ranked().find(r=>slug(r.e.name)===slug(me));
  if(!row){ hideLower(); return; }
  const rows=ranked(), pos=rows.findIndex(r=>slug(r.e.name)===slug(me))+1;
  const sp=season?.players?.find(p=>slug(p.name)===slug(me));
  $("l3k").textContent=`Tracking · Week ${week}`;
  $("l3t").textContent=up(row.e.name);
  $("l3s").textContent=`${pos ? ordinalWord(pos) : "—"} of ${rows.length}` +
    (row.s.rem?` · ${row.s.rem} games still open`:"") + (sp?` · ${sp.total} on the season`:"");
  $("l3v").textContent=row.s.c;
  $("lower").classList.add("on");
  clearTimeout(lowerTimer);
  lowerTimer=setTimeout(()=>$("lower").classList.remove("on"), 9000);   // graphics don't sit on screen
}
const ordinalWord=n=>{const r=n%100;if(r>=11&&r<=13)return n+"th";return n+(["th","st","nd","rd"][n%10]||"th");};

/* dock */
function openGame(id){
  const g=games().find(x=>x.id===id);if(!g)return;
  const w=winnerOf(g),rows=ranked(),sp=splitOf(g);
  const A=rows.filter(r=>r.e.picks?.[g.id]===g.away),H=rows.filter(r=>r.e.picks?.[g.id]===g.home);
  $("dHd").innerHTML=`<div class="chyron" style="margin:0"><span class="l">${g.state==="in"?"LIVE":w?"FINAL":"NEXT"}</span>
      <span class="r">${esc(g.away)} at ${esc(g.home)}</span></div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
      ${g.awayLogo?`<img src="${esc(g.awayLogo)}" style="width:42px;height:42px;object-fit:contain">`:""}
      <span class="cond" style="font-size:40px;font-weight:700;${w===g.away?"color:var(--win)":""}">${g.state==="pre"?"–":g.awayScore}</span>
      <span style="color:var(--muted);font-family:'Barlow Condensed';letter-spacing:.2em;margin:0 auto">AT</span>
      <span class="cond" style="font-size:40px;font-weight:700;${w===g.home?"color:var(--win)":""}">${g.state==="pre"?"–":g.homeScore}</span>
      ${g.homeLogo?`<img src="${esc(g.homeLogo)}" style="width:42px;height:42px;object-fit:contain">`:""}
    </div>
    <div style="font-family:'Barlow Condensed';letter-spacing:.14em;color:var(--muted);margin-top:8px">
      ${g.state==="in"?`Q${g.period} ${esc(g.clock)}${g.possession?` · ${esc(g.possession)} BALL`:""}`
        :w?(w==="TIE"?"FINAL · TIE":"FINAL"):new Date(g.kickoff).toLocaleString([],{weekday:"long",hour:"numeric",minute:"2-digit"})}</div>`;
  $("dBd").innerHTML=`<div class="sub2">Pool split</div>
    <div style="display:flex;height:9px;background:rgba(255,255,255,.08)">
      <i style="display:block;width:${sp.a/sp.tot*100}%;background:${w===g.away?"var(--win)":"var(--cy1)"}"></i>
      <i style="display:block;width:${sp.h/sp.tot*100}%;background:${w===g.home?"var(--win)":"rgba(255,255,255,.2)"}"></i></div>
    <div class="sub2">${esc(up(g.away))} · ${sp.a}</div>
    <ul class="names">${A.map(r=>`<li class="${w&&w!=="TIE"?(w===g.away?"hit":"miss"):""}">${esc(up(r.e.name))}</li>`).join("")||"<li>—</li>"}</ul>
    <div class="sub2">${esc(up(g.home))} · ${sp.h}</div>
    <ul class="names">${H.map(r=>`<li class="${w&&w!=="TIE"?(w===g.home?"hit":"miss"):""}">${esc(up(r.e.name))}</li>`).join("")||"<li>—</li>"}</ul>`;
  openDock();
}
function openPlayer(name){
  const row=ranked().find(r=>slug(r.e.name)===slug(name));if(!row)return;
  const gs=games(),sp=season?.players?.find(p=>slug(p.name)===slug(name));
  const ws=season?.weeks?.map(w=>w.week)||[];
  $("dHd").innerHTML=`<div class="chyron" style="margin:0"><span class="l">CARD</span>
      <span class="r">${esc(up(name))}</span></div>
    <div style="font-family:'Barlow Condensed';font-size:17px;letter-spacing:.08em;margin-top:12px;color:var(--ink2)">
      ${row.s.c} CORRECT THIS WEEK${sp?` · ${sp.total} ON THE SEASON`:""}</div>`;
  $("dBd").innerHTML=`<div class="sub2">This week's card</div>
    <div class="pills">${gs.map(g=>{const p=row.e.picks?.[g.id],w=winnerOf(g);
      if(!p)return`<div class="pl">—</div>`;
      const img=p===g.home?g.homeLogo:g.awayLogo;
      const cls=!w?"":w==="TIE"?"miss":p===w?"hit":"miss";
      return`<div class="pl ${cls}">${img?`<img src="${esc(img)}" alt="${esc(p)}">`:esc(p)}</div>`;}).join("")}</div>
    ${sp?`<div class="sub2">Week by week</div>
      <div class="lb">${ws.map(w=>`<div class="lbr" style="grid-template-columns:54px 1fr 54px">
        <div class="rk" style="font-size:16px">W${w}</div>
        <div class="meter"><i style="width:${(sp.byWeek[w]??0)/Math.max(...ws.map(x=>sp.byWeek[x]??0),1)*100}%"></i></div>
        <div class="val" style="font-size:20px">${sp.byWeek[w]??"—"}</div></div>`).join("")}</div>`:""}`;
  openDock();
}
function openDock(){$("dock").classList.add("on");$("scrim").classList.add("on");}
function closeDock(){$("dock").classList.remove("on");$("scrim").classList.remove("on");}
$("scrim").onclick=closeDock;
$("l3x").onclick=()=>{ me=""; localStorage.removeItem("pc.me"); $("meSel").value=""; hideLower(); render(); };
</script>
</body>
</html>
